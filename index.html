<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo2 3D AI</title>

<script type="module">
import { Client, handle_file } from "https://cdn.jsdelivr.net/npm/@gradio/client@1.3.0/+esm";

window.gradioClient = Client;
window.handleGradioFile = handle_file;
</script>

<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#080b12;
  color:white;
  min-height:100vh;
}

header{
  padding:20px;
  text-align:center;
  border-bottom:1px solid #202633;
}

.logo{
  font-size:25px;
  font-weight:bold;
}

.badge{
  display:inline-block;
  margin-top:8px;
  padding:6px 12px;
  border-radius:20px;
  background:#171d2b;
  color:#8fb4ff;
  font-size:12px;
}

.container{
  max-width:800px;
  margin:auto;
  padding:35px 18px;
}

h1{
  text-align:center;
  font-size:38px;
  margin-bottom:10px;
}

.subtitle{
  text-align:center;
  color:#9da6b8;
  margin-bottom:30px;
}

.upload{
  border:2px dashed #394355;
  border-radius:18px;
  padding:30px 20px;
  text-align:center;
  background:#0d111a;
  cursor:pointer;
}

.upload:hover{
  border-color:#6d8cff;
}

.upload input{
  display:none;
}

#preview{
  max-width:100%;
  max-height:350px;
  border-radius:12px;
  margin-top:20px;
  display:none;
}

button{
  width:100%;
  margin-top:20px;
  padding:16px;
  border:0;
  border-radius:12px;
  background:#5d7cff;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

#status{
  text-align:center;
  margin-top:18px;
  color:#aeb8ca;
  min-height:25px;
}

#viewerBox{
  display:none;
  margin-top:30px;
  background:#0d111a;
  border-radius:18px;
  padding:15px;
}

model-viewer{
  width:100%;
  height:500px;
  background:#111722;
  border-radius:14px;
}

.download{
  display:block;
  text-align:center;
  margin-top:15px;
  padding:14px;
  background:#20283a;
  color:white;
  text-decoration:none;
  border-radius:10px;
}

footer{
  text-align:center;
  padding:30px 15px;
  color:#687286;
  font-size:12px;
}
</style>
</head>

<body>

<header>
  <div class="logo">Photo2 3D AI</div>
  <div class="badge">FREE AI 3D GENERATOR</div>
</header>

<div class="container">

<h1>Turn Your Photo Into 3D</h1>

<p class="subtitle">
Upload one photo and generate a 3D model.
</p>

<label class="upload">
  <strong>📷 Choose Photo</strong>
  <br><br>
  <span>Tap here to select an image</span>
  <input id="fileInput" type="file" accept="image/*">
  <img id="preview">
</label>

<button id="generateBtn" disabled>
  Generate 3D Model
</button>

<div id="status"></div>

<div id="viewerBox">

  <model-viewer
    id="viewer"
    camera-controls
    auto-rotate
    shadow-intensity="1"
    exposure="1"
    ar>
  </model-viewer>

  <a id="downloadBtn"
     class="download"
     href="#"
     download="model.glb">
     ⬇️ Download 3D Model
  </a>

</div>

</div>

<footer>
  Powered by Stable Fast 3D
</footer>

<script type="module">

const fileInput = document.getElementById("fileInput");
const preview = document.getElementById("preview");
const generateBtn = document.getElementById("generateBtn");
const status = document.getElementById("status");
const viewerBox = document.getElementById("viewerBox");
const viewer = document.getElementById("viewer");
const downloadBtn = document.getElementById("downloadBtn");

let selectedFile = null;

fileInput.addEventListener("change", () => {

  selectedFile = fileInput.files[0];

  if(!selectedFile){
    generateBtn.disabled = true;
    return;
  }

  preview.src = URL.createObjectURL(selectedFile);
  preview.style.display = "block";

  viewerBox.style.display = "none";

  generateBtn.disabled = false;

  status.textContent = "✅ Photo selected. Now tap Generate 3D Model.";

});


generateBtn.addEventListener("click", async () => {

  if(!selectedFile) return;

  generateBtn.disabled = true;

  status.textContent =
    "⏳ Connecting to free AI server...";

  try {

    const client =
      await window.gradioClient.connect(
        "stabilityai/stable-fast-3d"
      );

    status.textContent =
      "⏳ AI is creating your 3D model... Please wait.";

    const imageFile =
      await window.handleGradioFile(selectedFile);

    /*
      Official Stable Fast 3D Space currently exposes
      run_button with these inputs:

      Run
      input image
      background state
      foreground ratio
      remeshing
      vertex count
      texture size
    */

    const result = await client.predict(
      "/run_button",
      [
        "Run",
        imageFile,
        imageFile,
        0.85,
        "None",
        -1,
        1024
      ]
    );

    const output = result.data[4];

    if(!output){
      throw new Error("3D model was not returned.");
    }

    let modelUrl = null;

    if(typeof output === "string"){
      modelUrl = output;
    }

    else if(output.url){
      modelUrl = output.url;
    }

    else if(output.path){
      modelUrl = output.path;
    }

    if(!modelUrl){
      throw new Error("Could not read generated model.");
    }

    viewer.src = modelUrl;

    downloadBtn.href = modelUrl;

    viewerBox.style.display = "block";

    status.textContent =
      "✅ 3D Model ready! You can rotate it below.";

  }

  catch(error){

    console.error(error);

    status.textContent =
      "❌ Generation failed: " +
      (error.message || "Please try again.");

  }

  finally{

    generateBtn.disabled = false;

  }

});

</script>

</body>
</html>
